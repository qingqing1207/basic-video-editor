[package]
name = "blur"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/blur.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
gpu = { version = "0.1.0", path = "../gpu" }
thiserror = "2.0.18"
wgpu = "29.0.1"
